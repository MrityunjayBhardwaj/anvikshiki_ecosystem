# data/copywriting_expert.yaml — Copywriting: First Principles to Expert Mastery
# Transcribed from guides/v325_new/copywriting/volume_1/ Stage 2 + Stage 3 output
# Domain: TYPE 4 (Practical/Craft) with secondary Type 3 (Empirical) + Type 5
#
# WHY THIS KB EXISTS (#20): the engine has been exercised against exactly one
# knowledge base, and that one is not a neutral sample. business_expert.yaml
# says so in its own header — "Notable features for engine testing: rebutting
# conflict V11 vs V01, scope exclusions for undercutting attacks." It was
# shaped, at least in part, for the engine that would read it.
#
# This KB was not. The nine vyāptis, seven hetvābhāsas, dependency DAG and
# threshold concepts below were hand-authored on 27 Feb 2026 for a human
# reader, with no engine in mind and no knowledge that one would ever compile
# them. Nothing here was added, removed or reshaped to make the engine behave.
# That is the whole point: what the engine does with this file is evidence
# about the engine, not about the transcription.
#
# TWO TRANSLATIONS WERE UNAVOIDABLE, and they are judgment calls, not copies:
#
#  1. causal_status vocabulary. The guide writes CAUSAL / STRUCTURAL /
#     EMPIRICAL REGULARITY; the schema offers structural / regulatory /
#     empirical / definitional. Mapping used throughout:
#         CAUSAL               -> empirical    (an observed, intervenable regularity)
#         EMPIRICAL REGULARITY -> empirical    (observed, mechanism less characterised)
#         STRUCTURAL           -> structural
#     CAUSAL and EMPIRICAL REGULARITY collapse onto one value. The distinction
#     the author drew — whether the mechanism is characterised — survives only
#     in confidence.evidence and in the epistemic_status, which is where V5,
#     V8 and V9 are marked down.
#
#  2. antecedents / consequent. The guide states each vyāpti in prose and
#     never names a predicate. Every predicate below was read off the
#     statement and its scope paragraph, and the two chains (V1->V3, V4->V8)
#     are the author's own words: V3 operates only once attention is captured,
#     and V8 says in as many words that "editing can't fix strategic errors —
#     polishing copy aimed at the wrong awareness level is wasted effort."
#     No third chain was manufactured to make the graph look richer.
#
# WHAT IS DELIBERATELY ABSENT, stated here so its absence is not read as an
# oversight: there is no rebutting pair. business_expert.yaml has V11
# concluding not_value_creation against V01's value_creation. Nothing among
# these nine concludes the negation of another, because the author never wrote
# one. Inventing a tenth vyāpti to supply one would have destroyed the very
# measurement this file exists to make — and would also have corrupted the
# 11 / 9 / 10 vyāpti-count pattern #20 was filed to confirm. Undercutting
# attacks, by contrast, should be plentiful: every vyāpti here carries scope
# exclusions, because the author wrote a "Scope conditions" paragraph for
# each one describing where it relaxes and where it breaks.
#
# The reference_bank below carries title / author / year only — no DOIs, no
# ISBNs, no resolution blocks. That is the shape business_expert.yaml had
# before #104 retrofitted it, and #16's copywriting retrofit is the separate
# hour of work that fixes it. See test_copywriting_expert.py, which asserts
# that zero WITH its denominator so this bank cannot pass for retrofitted.

domain_type: CRAFT
pramanas: ["pratyaksa", "anumana", "sabda", "upamana"]

vyaptis:
  V1:
    id: V1
    name: "The Attention Gate"
    statement: "No persuasion occurs without prior attention capture; copy that fails to stop the reader in the first 3-8 seconds never enters the persuasion sequence, regardless of the strength of the argument, offer or proof downstream"
    causal_status: empirical
    scope_conditions: ["voluntary_readership"]
    scope_exclusions: ["captive_audience"]
    confidence: {existence: 0.95, formulation: 0.9, evidence: "experimental"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_kahneman_2011", "src_sugarman_2006", "src_ogilvy_1983", "src_cro_benchmarks"]
    antecedents: ["attention_captured"]
    consequent: "persuasion_possible"

  V2:
    id: V2
    name: "The Specificity-Credibility Link"
    statement: "Specific, concrete claims are more persuasive than vague or general claims, all else being equal, because the mind reads precision as a signal of actual measurement while vagueness reads as ignorance or deception"
    causal_status: empirical
    scope_conditions: []
    scope_exclusions: ["underwhelming_magnitude", "narrative_preferring_audience", "quick_processing_context"]
    confidence: {existence: 0.9, formulation: 0.85, evidence: "experimental"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_ogilvy_rolls_royce_1958", "src_hopkins_1923", "src_ab_test_databases"]
    antecedents: ["specific_claim"]
    consequent: "perceived_credibility"

  # Chains from V1: the problem-first sequence can only operate on a reader
  # who is still present. "Attention is the non-negotiable prerequisite;
  # everything else is conditional on it" (VYĀPTI 1, stage2_architecture.md).
  V3:
    id: V3
    name: "The Problem-First Persuasion Sequence"
    statement: "Copy that begins with the reader's felt problem and bridges to the solution consistently outperforms copy that begins with the product, because we move away from pain before we move toward gain"
    causal_status: empirical
    scope_conditions: ["selling_context"]
    scope_exclusions: ["most_aware_audience", "desire_driven_category", "informational_intent"]
    confidence: {existence: 0.9, formulation: 0.85, evidence: "experimental"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_kahneman_tversky_1979", "src_schwartz_1966", "src_halbert_boron"]
    antecedents: ["problem_first_sequence", "persuasion_possible"]
    consequent: "reader_receptive"

  V4:
    id: V4
    name: "The Awareness-Level Law"
    statement: "The effectiveness of any piece of copy is primarily determined by the match between its assumptions about the reader's awareness level and the reader's actual awareness level; mismatched awareness is the most common strategic failure in copywriting and is invisible to writers who have not internalised it"
    causal_status: structural
    scope_conditions: ["targeted_channel"]
    scope_exclusions: ["broad_reach_channel"]
    confidence: {existence: 0.95, formulation: 0.8, evidence: "expert_consensus"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_schwartz_1966", "src_modern_awareness_applications"]
    antecedents: ["awareness_level_matched"]
    consequent: "strategic_fit"

  V5:
    id: V5
    name: "The Voice-Trust Compound"
    statement: "A distinctive, consistent brand voice compounds trust over time, while a generic or inconsistent voice produces diminishing returns regardless of copy quality; voice is not decoration on top of persuasion, it is itself a persuasion mechanism"
    causal_status: empirical
    scope_conditions: ["sequential_copy"]
    scope_exclusions: ["one_shot_short_form", "commodity_purchase"]
    confidence: {existence: 0.8, formulation: 0.6, evidence: "observational"}
    epistemic_status: hypothesis
    decay_risk: low
    sources: ["src_ogilvy_1983", "src_wiebe_copyhackers", "src_horton_wohl_1956"]
    antecedents: ["distinctive_voice", "voice_consistency"]
    consequent: "compounding_trust"

  # Second producer of perceived_credibility, alongside V2. Two independent
  # routes to one conclusion, which is the shape business_expert.yaml has at
  # long_term_value.
  V6:
    id: V6
    name: "The Proof Hierarchy"
    statement: "Claims without proof are processed as marketing, claims with generic proof as slightly more credible marketing, and claims with specific verifiable proof as information; moving one level up the proof hierarchy for a key claim can shift conversion more than rewriting the surrounding copy"
    causal_status: empirical
    scope_conditions: []
    scope_exclusions: ["proof_resistant_market", "subjective_appeal_category"]
    confidence: {existence: 0.9, formulation: 0.85, evidence: "experimental"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_cialdini_1984", "src_hopkins_1923", "src_petty_cacioppo_1986"]
    antecedents: ["specific_verifiable_proof"]
    consequent: "perceived_credibility"

  V7:
    id: V7
    name: "The Friction-Conversion Inverse"
    statement: "Every point of cognitive friction between the reader's current state and the desired action reduces conversion probability, and reducing friction produces gains that are independent of, and often larger than, gains from improving persuasive quality"
    causal_status: empirical
    scope_conditions: []
    scope_exclusions: ["deliberate_qualifying_friction", "high_consideration_long_form"]
    confidence: {existence: 0.9, formulation: 0.85, evidence: "experimental"}
    epistemic_status: established
    decay_risk: low
    sources: ["src_kahneman_tversky_1979", "src_cxl_friction_methodology", "src_cro_benchmarks"]
    antecedents: ["friction_reduced"]
    consequent: "conversion_lift"

  # Chains from V4. The scope paragraph is explicit: "editing can't fix
  # strategic errors — polishing copy aimed at the wrong awareness level is
  # wasted effort." So strategic_fit is an antecedent, not a nicety.
  V8:
    id: V8
    name: "The Editing Multiplier"
    statement: "The ratio of persuasive impact between first-draft copy and expertly edited copy is typically 2:1 to 5:1; editing produces more improvement per hour invested than any other copy activity, and the craft of copywriting is primarily an editing craft"
    causal_status: empirical
    scope_conditions: []
    scope_exclusions: ["speed_critical_context"]
    confidence: {existence: 0.85, formulation: 0.5, evidence: "observational"}
    epistemic_status: hypothesis
    decay_risk: low
    sources: ["src_zinsser_1976", "src_halbert_boron", "src_practitioner_time_allocation"]
    antecedents: ["expert_editing_applied", "strategic_fit"]
    consequent: "copy_effective"

  V9:
    id: V9
    name: "The AI Complement Principle"
    statement: "AI writing tools are strong at generating structurally competent prose and weak at strategic judgment, so as AI capability increases the value of human copywriters shifts from production toward judgment: taste, strategic diagnosis, voice development, and the ability to evaluate and improve AI output"
    causal_status: structural
    scope_conditions: []
    scope_exclusions: []
    confidence: {existence: 0.8, formulation: 0.55, evidence: "expert_consensus"}
    epistemic_status: contested
    decay_risk: high
    decay_condition: "Re-evaluate annually against frontier models. Specific capabilities to recheck: voice consistency, strategic awareness matching, creative originality, proof evaluation. Shelf life 12-18 months before partial revision needed."
    sources: ["src_ai_industry_surveys_2025", "src_llm_architecture_analysis"]
    antecedents: ["ai_drafting_used"]
    consequent: "human_judgment_value_increases"

hetvabhasas:
  H1:
    id: H1
    name: "The Template Fallacy"
    description: "Concluding that copy is good because it follows a persuasion framework; following AIDA or PAS guarantees structural completeness but not persuasive quality, and you can write terrible copy that follows AIDA perfectly"
    detection_signature: "framework_compliance_cited_as_quality_evidence"
    correction_pattern: "Frameworks are scaffolds, not blueprints — evaluate the execution (word choice, specificity, rhythm, voice, psychological precision) separately from the structure"
    common_contexts: ["beginner_copy_review", "agency_deliverables", "template_marketplaces"]

  H2:
    id: H2
    name: "The Cleverness Trap"
    description: "Prioritising elegance, wit or literary quality over clarity and persuasive function, so that the reader admires the line but does not understand what is being sold"
    detection_signature: "craft_praise_without_conversion_evidence"
    correction_pattern: "Ask what action the copy is for; cleverness that serves the function is good, cleverness that obscures it is self-indulgence. Awards are not conversions"
    common_contexts: ["creative_awards", "brand_campaigns", "writers_with_artistic_training"]

  H3:
    id: H3
    name: "The Feature-Benefit Confusion"
    description: "Describing what the product does instead of what the reader gets, forcing the reader to do the translation work that most readers will not do"
    detection_signature: "product_capability_stated_without_reader_outcome"
    correction_pattern: "Translate each feature into an improvement in the reader's life; keep features as proof mechanisms supporting the benefit claim, not as the claim"
    common_contexts: ["technical_products", "ai_product_copy", "founder_written_copy"]

  H4:
    id: H4
    name: "The Audience of One"
    description: "Writing copy based on what would persuade the writer rather than researching what would persuade the actual audience, projecting one's own knowledge level, pain points and decision criteria onto the market"
    detection_signature: "no_audience_research_cited_for_audience_claims"
    correction_pattern: "Do voice-of-customer research; the writer is almost never representative of the target audience, and once you know something you cannot easily reconstruct not knowing it"
    common_contexts: ["founder_written_copy", "in_house_marketing", "solo_practitioners"]

  H5:
    id: H5
    name: "The Social Proof Cascade"
    description: "Copying the style, structure or tactics of competitors and popular brands without understanding the strategic context that makes those choices work for that brand and that audience"
    detection_signature: "competitor_practice_cited_as_justification"
    correction_pattern: "Identify the strategic context that makes the observed choice work — brand equity, awareness level, category position — and check whether yours matches before borrowing the tactic"
    common_contexts: ["competitive_analysis", "saas_landing_pages", "category_conventions"]

  H6:
    id: H6
    name: "The Optimization Myopia"
    description: "Treating A/B test results as the sole arbiter of copy quality, without considering brand consistency, long-term trust effects, or whether the test measured the right thing"
    detection_signature: "short_term_metric_win_treated_as_quality_verdict"
    correction_pattern: "Ask what the test could not see — trust erosion, lifetime value, word of mouth, positioning for the next interaction. Optimising hard for immediate conversion can cannibalise long-term value"
    common_contexts: ["conversion_optimization", "email_subject_testing", "performance_marketing"]

  H7:
    id: H7
    name: "The AI Equivalence Error"
    description: "Concluding from AI's surface competence that human copywriting skill is commoditised — or, inversely, that AI copy is always bad and will never matter. Both mistake surface-level competence for the full skill stack"
    detection_signature: "ai_capability_claim_without_layer_distinction"
    correction_pattern: "Separate the layers: AI is competent at first drafts, variations and consistency at scale, and weak at awareness matching, distinctive voice, original framing and proof evaluation. Name which layer the claim is about"
    common_contexts: ["ai_tooling_debates", "agency_positioning", "professional_identity"]

threshold_concepts:
  - name: "Awareness Levels as the Strategic Frame"
    reorganizes: ["copy_quality_definition", "framework_selection", "writing_skill_understanding"]
    prerequisites: ["attention_psychology", "decision_psychology"]
    troublesome_aspects: ["humbling — writing well is not sufficient", "beautiful prose may need replacing with blunt language", "frameworks stop being universal solutions"]

  - name: "The Diagnostic Lens — Copy as Readable Structure"
    reorganizes: ["copy_evaluation", "self_editing", "ai_output_assessment"]
    prerequisites: ["core_persuasion_principles", "copywriting_frameworks"]
    troublesome_aspects: ["requires a new perceptual vocabulary", "feels overly formal until it clicks", "conscious incompetence — realising how much was being missed"]

  - name: "Voice as Trained Intuition, Not Natural Talent"
    reorganizes: ["voice_development", "talent_vs_craft_belief", "brand_language_practice"]
    prerequisites: ["core_persuasion_principles"]
    troublesome_aspects: ["folk theory says voice is innate personality", "known in theory before it is experienced in writing"]

