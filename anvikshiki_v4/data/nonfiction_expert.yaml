reference_bank:
  # Transcribed from stage3_reference_bank.md, which holds 118 numbered
  # references across chapters 1–20. The subset below is the one the ten
  # vyāptis actually rest on: the anchor texts and primary sources of each
  # rule's anchoring chapters. Selecting rather than transcribing all 118 is
  # a judgment call, and it is the same call copywriting made — a reference
  # bank is what the rules cite, not everything the volume read.
  #
  # TITLE / AUTHOR / YEAR ONLY. NO IDENTIFIERS, NO RESOLUTION BLOCKS. Not an
  # omission: the source bank carries ZERO DOIs and ZERO ISBNs across all 118
  # entries, so there is nothing to transcribe and inventing one would be the
  # exact defect the citation tier exists to catch. #16's retrofit is separate
  # work, and test_nonfiction_expert.py asserts this zero WITH its denominator.
  #
  # Several entries are classical texts with no meaningful single year — the
  # Nyāya Sūtras, the Sāṃkhyakārikā, the Yoga Sūtras, the Arthaśāstra. Where
  # the author cites a specific translation, the translation's year is used
  # and the translator named; where the work itself is cited, `year` is
  # omitted rather than guessed. That absence is correct, not a gap — the
  # same shape #107's fourth resolution status was added for.

